name: Deploy to GitHub Pages

on:
  # Publish whenever the app changes on the main branch.
  push:
    branches: ["main"]
  # Allow running this workflow manually from the Actions tab.
  workflow_dispatch:

# Permissions needed for the GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; skip queued runs in favor of the latest.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Project Pages URL needs the repo base path; custom domains use `/`.
        run: VITE_BASE=/Sovereign-app/ npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        # `enablement: true` requires a token with admin-level repository
        # permissions, which the default workflow token does not have.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
